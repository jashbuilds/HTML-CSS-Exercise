<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>

<body>
    <form action="submit-accept.html" target="_self" autocomplete="on">
        <fieldset>
            <legend>
                <h2><strong>Registration</strong></h2>
            </legend>
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname" pattern="^[A-Za-z]+$" max-length="20" required autofocus
                oninvalid="this.setCustomValidity('Enter Characters Only!')" oninput="this.setCustomValidity('')" />
            <br><br>
            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname" pattern="^[A-Za-z]+$" max-length="20" required
                oninvalid="this.setCustomValidity('Enter Characters Only!')" oninput="this.setCustomValidity('')" />
            <br><br>
            <label for="gender">Gender </label>
            <br>

            <div class="radio-grp">
                <input type="radio" id="male" name="gender" required>
                <label for="male">Male</label>

                <br>
                <input type="radio" id="female" name="gender">
                <label for="female">Female</label>
            </div>

            <br><br>

            <div class="checkbox-group">
                <label for="tech">Technologies:</label><br>

                <input type="checkbox" id="html" name="checkbox-grp" required checked>
                <label for="html">HTML</label>
                <br>

                <input type="checkbox" id="css" name="checkbox-grp">
                <label for="css">CSS</label>
                <br>

                <input type="checkbox" id="js" name="checkbox-grp">
                <label for="js">JS</label>
                <br><br>
            </div>


            <label for="prof">Choose Your Profession:</label>
            <select name="prof" id="prof">
                <option value="student" selected>Student</option>
                <option value="developer">Developer</option>
                <option value="professor">Professor</option>
            </select>
            <br><br>

            <label for="city">Choose Your City:</label>
            <input list="browsers" id="browser" required>
            <datalist id="browsers">
                <option value="Rajkot">Rajkot</option>
                <option value="Ahmedabad">Ahmedabad</option>
                <option value="Surat">Surat</option>
                <option value="Bombay">Bombay</option>
            </datalist>
            <br><br>

            <label for="email">Enter Your E-Mail:</label>
            <input type="email" id="email" name="email" required
                oninvalid="this.setCustomValidity('Expected Format (eg: abc@sample.com)')"
                oninput="this.setCustomValidity('')">
            <br><br>

            <label for="pass">Enter Password:</label>
            <input type="password number" id="pass" name="pass" required pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                oninvalid="this.setCustomValidity('password should be 8 chars long & should contain Uppercase, Lowercase & Numerics')"
                oninput="this.setCustomValidity('')" />
            <br><br>

            <label for=" birthday">Enter Your Birthdate:</label>
            <input type="date" id="birthday" name="birthday" required>
            <br><br>

            <label for="file">Select Profile Image:</label>
            <input type="file" id="profile" accept="image/*" required>
            <br><br>

            <label for="phone">Enter Your Contact No:</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" maxlength="10" placeholder="0123456789"
                required onkeypress='return restrictAlphabets(event)'>

            <br><br>

            <label for="review">Write Your Reviews:</label>
            <br>
            <textarea name="review" id="review" placeholder="your review here..." rows="10" cols="50"></textarea>

            <br><br>
            <button type="submit" onsubmit="">Submit</button>
            <input type="reset" name="reset">
        </fieldset>
    </form>


    <script type="text/javascript">
        /*code: 48-57 Numbers*/
        function restrictAlphabets(e) {
            var x = e.which || e.keycode;
            if ((x >= 48 && x <= 57))
                return true;
            else
                return false;
        }
    </script>
</body>

</html>
